<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Kush Ise — AI &amp; Systems Engineer. I build agents, evals, and the infrastructure behind them.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a17"/>
      <stop offset="1" stop-color="#130b2e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#a78bfa" stop-opacity=".12"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset=".33" stop-color="#a78bfa"/>
      <stop offset=".66" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#67e8f9"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="gA"><stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB"><stop offset="0" stop-color="#06b6d4" stop-opacity=".40"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <radialGradient id="gC"><stop offset="0" stop-color="#db2777" stop-opacity=".30"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></radialGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#4c1d95"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="400" rx="22"/></clipPath>
    <clipPath id="typing">
      <rect x="56" y="58" width="0" height="34">
        <animate attributeName="width" from="0" to="250" begin=".3s" dur="1.1s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .f{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
    .d1{animation-delay:1.3s}.d2{animation-delay:1.6s}.d3{animation-delay:1.85s}
    .d4{animation-delay:2.1s}.d5{animation-delay:2.25s}.d6{animation-delay:2.4s}.d7{animation-delay:2.7s}
    .g{opacity:0;animation:fade 1.4s ease forwards .6s}
    .cursor{animation:blink 1s steps(1) infinite}
    .flow{stroke-dasharray:3 9;animation:dash 1.2s linear infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
    .live{animation:blink 2s ease-in-out infinite}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes fade{to{opacity:1}}
    @keyframes blink{50%{opacity:0}}
    @keyframes dash{to{stroke-dashoffset:-24}}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.1);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.f,.g{opacity:1}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#dots)"/>

    <!-- drifting aurora -->
    <circle cx="300" cy="80" r="320" fill="url(#gA)">
      <animateTransform attributeName="transform" type="translate" values="0 0;60 30;0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="360" r="300" fill="url(#gB)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-50 -40;0 0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="-40" r="240" fill="url(#gC)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-40 50;0 0" dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- prompt -->
    <g clip-path="url(#typing)">
      <text x="60" y="84" class="mono" font-size="20" fill="#64748b">~ <tspan fill="#67e8f9">❯</tspan> <tspan fill="#e2e8f0">whoami --verbose</tspan></text>
    </g>
    <rect class="cursor" x="312" y="68" width="10" height="20" rx="1" fill="#67e8f9"/>

    <!-- name + title -->
    <text x="56" y="172" class="sans f d1" font-size="86" font-weight="800" letter-spacing="-2" fill="url(#name)">Kush Ise</text>
    <text x="60" y="218" class="sans f d2" font-size="28" font-weight="600" fill="#f1f5f9">AI &amp; Systems Engineer</text>
    <text x="60" y="252" class="sans f d3" font-size="18" fill="#94a3b8">I build agents, evals, and the infrastructure behind them.</text>

    <!-- chips -->
    <g class="mono f d4" font-size="14">
      <rect x="60" y="282" width="200" height="34" rx="17" fill="#0f172a" fill-opacity=".7" stroke="#facc15" stroke-opacity=".55"/>
      <circle cx="80" cy="299" r="4" fill="#facc15"/>
      <text x="94" y="304" fill="#fde68a">20 hackathon wins</text>
    </g>
    <g class="mono f d5" font-size="14">
      <rect x="272" y="282" width="250" height="34" rx="17" fill="#0f172a" fill-opacity=".7" stroke="#a78bfa" stroke-opacity=".6"/>
      <circle cx="292" cy="299" r="4" fill="#a78bfa"/>
      <text x="306" y="304" fill="#ddd6fe">1st · JetBrains × Codex</text>
    </g>
    <g class="mono f d6" font-size="14">
      <rect x="534" y="282" width="208" height="34" rx="17" fill="#0f172a" fill-opacity=".7" stroke="#67e8f9" stroke-opacity=".55"/>
      <circle cx="554" cy="299" r="4" fill="#67e8f9"/>
      <text x="568" y="304" fill="#cffafe">13M+ users shipped</text>
    </g>

    <!-- footer line -->
    <text x="60" y="366" class="mono f d7" font-size="13" fill="#64748b">M.S. CS (AI/ML) @ UC Riverside  ·  building eval infra @ XTrace  ·  SF Bay Area</text>
    <g class="f d7">
      <circle class="live" cx="880" cy="361" r="4.5" fill="#4ade80"/>
      <text x="892" y="366" class="mono" font-size="13" fill="#86efac">open to AI · infra · agent roles</text>
    </g>

    <!-- agent graph -->
    <g class="g">
      <circle cx="960" cy="186" r="132" fill="none" stroke="#a78bfa" stroke-opacity=".22" stroke-dasharray="2 8">
        <animateTransform attributeName="transform" type="rotate" from="0 960 186" to="360 960 186" dur="40s" repeatCount="indefinite"/>
      </circle>
      <circle cx="960" cy="186" r="84" fill="none" stroke="#67e8f9" stroke-opacity=".12"/>

      <g stroke-width="1.5" fill="none">
        <path class="flow" d="M960 186 L960 56"   stroke="#67e8f9" stroke-opacity=".7"/>
        <path class="flow" d="M960 186 L1086 146" stroke="#f0abfc" stroke-opacity=".7"/>
        <path class="flow" d="M960 186 L1038 292" stroke="#facc15" stroke-opacity=".6"/>
        <path class="flow" d="M960 186 L882 292"  stroke="#4ade80" stroke-opacity=".6"/>
        <path class="flow" d="M960 186 L834 146"  stroke="#a78bfa" stroke-opacity=".7"/>
      </g>

      <!-- packets -->
      <g>
        <circle r="3.5" fill="#67e8f9"><animateMotion path="M960 186 L960 56" dur="2.2s" repeatCount="indefinite"/></circle>
        <circle r="3.5" fill="#f0abfc"><animateMotion path="M1086 146 L960 186" dur="2.6s" begin=".5s" repeatCount="indefinite"/></circle>
        <circle r="3.5" fill="#facc15"><animateMotion path="M960 186 L1038 292" dur="2.4s" begin="1s" repeatCount="indefinite"/></circle>
        <circle r="3.5" fill="#4ade80"><animateMotion path="M882 292 L960 186" dur="2.8s" begin=".3s" repeatCount="indefinite"/></circle>
        <circle r="3.5" fill="#a78bfa"><animateMotion path="M960 186 L834 146" dur="2.3s" begin="1.4s" repeatCount="indefinite"/></circle>
      </g>

      <g class="mono" font-size="11" text-anchor="middle">
        <circle cx="960" cy="56" r="29" fill="#0b1224" stroke="#67e8f9"/>
        <text x="960" y="60" fill="#cffafe">MCP</text>
        <circle cx="1086" cy="146" r="29" fill="#0b1224" stroke="#f0abfc"/>
        <text x="1086" y="150" fill="#fae8ff">evals</text>
        <circle cx="1038" cy="292" r="29" fill="#0b1224" stroke="#facc15"/>
        <text x="1038" y="296" fill="#fef9c3">policy</text>
        <circle cx="882" cy="292" r="29" fill="#0b1224" stroke="#4ade80"/>
        <text x="882" y="296" fill="#dcfce7">memory</text>
        <circle cx="834" cy="146" r="29" fill="#0b1224" stroke="#a78bfa"/>
        <text x="834" y="150" fill="#ede9fe">tools</text>
      </g>

      <circle class="pulse" cx="960" cy="186" r="38" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="960" cy="186" r="38" fill="url(#core)" stroke="#c4b5fd" stroke-width="1.5"/>
      <text x="960" y="191" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">agent</text>
    </g>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="398.5" rx="21.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
